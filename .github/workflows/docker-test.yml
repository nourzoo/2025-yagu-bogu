name: YaguBogu Backend Dev

on:
  push:
    branches: [ "docker-test" ]
    paths:
      - "backend/**"
      - ".github/workflows/docker-test.yml"
  workflow_dispatch:

env:
  IMAGE: nourzoo/yagubogu-backend
  TAG_LATEST: dev-latest

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Tests
        run: ./gradlew test


  build:
    needs: ci
    runs-on: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4   # ✅ 이게 있어야 ./backend 가 생김

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_DEPLOY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DEPLOY_TOKEN }}

      #      - name: Docker Image Build & Push (arm64-arch)
      #        uses: docker/build-push-action@v5
      #        with:
      #          context: ./backend
      #          file: ./backend/Dockerfile
      #          push: true
      #          platforms: linux/arm64
      #          tags: ${{ env.IMAGE }}:${{ env.TAG_LATEST }}
      #          cache-from: type=registry,ref=${{ env.IMAGE }}:build-cache
      #          cache-to: type=registry,ref=${{ env.IMAGE }}:build-cache,mode=max

      - name: Docker Image Build & Push (arm64-arch)
        run: |
          # Dockerfile 경로: backend/Dockerfile
          docker buildx build \
          --cache-to=type=registry,ref=$IMAGE:build-cache,mode=max \
          --cache-from=type=registry,ref=$IMAGE:build-cache \
          -f Dockerfile \
          --platform linux/arm64 \
          -t $IMAGE:$TAG_LATEST \
          --push \
          .
